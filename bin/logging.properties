# Logger für SmartTiming

log4d.PathsConfigRelative=true

log4d.logger.SmartTiming.Settings=Info,LogFileAppender

# Ausgabe in Textdatei
log4d.appender.LogFileAppender=TLogFileAppender
log4d.appender.LogFileAppender.append=true
log4d.appender.LogFileAppender.fileName=SmartTiming.log
log4d.appender.LogFileAppender.MaxFileSize=20480
log4d.appender.LogFileAppender.layout=TLogPatternLayout
log4d.appender.LogFileAppender.layout.pattern=%-7T %d ; %-15u ; %-7p ; %-9P; %-9V; %c ; %m %e %n
log4d.appender.LogFileAppender.layout.dateFormat=yyyy-mm-dd hh:nn:ss.zzz

